name: test
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python make_sample.py
      - name: Reports on the sample files
        shell: python
        run: |
          import subprocess, sys
          def run(name):
              return subprocess.run([sys.executable, "jsoncheck.py", "sample/" + name], capture_output=True, text=True)
          good = run("good.json")
          assert good.returncode == 0 and "No problems found" in good.stdout, good.stdout
          for name, text in (("broken.json", "Line 4, column 3"), ("repeated.json", "'title' appears more than once"), ("bom.json", "byte order mark")):
              out = run(name)
              assert out.returncode == 1 and text in out.stdout, (name, out.stdout)
          print("Sample file reports checked.")
